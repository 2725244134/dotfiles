# ===
# === 基本设置
# ===

font_family      family="Maple Mono NF CN" style=Regular
bold_font        family="Maple Mono NF CN" style=Bold
italic_font      family="Maple Mono NF CN" style=Italic
bold_italic_font family="Maple Mono NF CN" style="Bold Italic"
font_size        14
cursor_shape     block
shell_integration no-cursor
cursor_trail     3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2
copy_on_select   clipboard
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask
notify_on_cmd_finish invisible 10.0
mouse_hide_wait  0
confirm_os_window_close 0
shell            fish
enabled_layouts  splits,stack

enable_kitty_keyboard_protocol no
# ===
# === 主题 (wezterm-mocha 色彩)
# ===

# 16色调色板
color0  #0C0C0C
color1  #C50F1F
color2  #13A10E
color3  #C19C00
color4  #0037DA
color5  #881798
color6  #3A96DD
color7  #CCCCCC
color8  #767676
color9  #E74856
color10 #16C60C
color11 #F9F1A5
color12 #3B78FF
color13 #B4009E
color14 #61D6D6
color15 #F2F2F2

# 前景/背景
background #1f1f28
foreground #cdd6f4

# 光标
cursor           #f5e0dc
cursor_text_color #11111b

# 选择
selection_background #f5e0dc
selection_foreground #11111b

# ===
# === 背景
# ===

background_opacity 1.0
background_image   ~/.config/kitty/themes/youi.jpg
background_image_layout cscaled
background_tint    0.90

# ===
# === 窗口设置
# ===

hide_window_decorations yes
window_padding_width    0

# ===
# === 快捷键
# ===

# 复制粘贴
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# 标签页操作
map alt+t       new_tab
map alt+w       close_tab
map alt+[       previous_tab
map alt+]       next_tab
map alt+ctrl+[  move_tab_backward
map alt+ctrl+]  move_tab_forward

# 分屏操作
map alt+backslash       combine : goto_layout splits : launch --location=vsplit
map alt+ctrl+backslash  combine : goto_layout splits : launch --location=hsplit
map alt+enter           toggle_layout stack
map alt+x       close_window

# 分屏导航
map alt+up      neighboring_window up
map alt+down    neighboring_window down
map alt+left    neighboring_window left
map alt+right   neighboring_window right
map alt+j       next_window
map alt+k       previous_window

# 滚动
map ctrl+u      scroll_line_up
map ctrl+d      scroll_line_down
map page_up     scroll_page_up
map page_down   scroll_page_down

# 字体大小
map alt+ctrl+equal  change_font_size all +1.0
map alt+ctrl+minus  change_font_size all -1.0
map alt+ctrl+0      change_font_size all 0

# 分屏大小调整
map alt+ctrl+up     resize_window taller 3
map alt+ctrl+down   resize_window shorter 3
map alt+ctrl+left   resize_window narrower 3
map alt+ctrl+right  resize_window wider 3

# ===
# === 其他
# ===

enable_audio_bell no
